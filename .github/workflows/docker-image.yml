name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'  # Match tags like v3.5.3
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG
        id: vars
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "IMAGE_TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag docker-registry.petits-bouts.com/sbb-dashboard-api:${{ env.IMAGE_TAG }} \
            .

      - name: Push Docker image to local registry
        run: |
          docker push docker-registry.petits-bouts.com/sbb-dashboard-api:${{ env.IMAGE_TAG }}
